<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회식 장소 투표</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdw8ASRhd_L-c7YZjyMjPpGA8X7XI0Puo",
            authDomain: "space-87168.firebaseapp.com",
            projectId: "space-87168",
            storageBucket: "space-87168.firebasestorage.app",
            messagingSenderId: "577886745261",
            appId: "1:577886745261:web:6c1fba8c420f22b370cc24",
            measurementId: "G-4FFTEPXPLK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.firebaseDB = db;
        window.firebaseDoc = doc;
        window.firebaseSetDoc = setDoc;
        window.firebaseOnSnapshot = onSnapshot;
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --bg-hover: #252525;
            --border: #2a2a2a;
            --text-primary: #fafafa;
            --text-secondary: #a1a1a1;
            --text-muted: #666;
            --accent-hover: #e5e5e5;
            --success: #22c55e;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --gold: #fbbf24;
            --silver: #9ca3af;
            --bronze: #d97706;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 64px 24px;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9375rem;
            margin-bottom: 48px;
        }

        .page { display: none; }
        .page.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 선택 카드 */
        .place-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        .place-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .place-card:hover {
            border-color: #3a3a3a;
            background: var(--bg-hover);
        }

        .place-card.selected-1,
        .place-card.selected-2 {
            border-color: var(--gold);
            background: rgba(251, 191, 36, 0.08);
        }

        .place-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .place-badge {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 100px;
        }

        .place-card.selected-1 .place-badge {
            display: flex;
            color: var(--gold);
            background: rgba(251, 191, 36, 0.15);
        }

        .place-card.selected-2 .place-badge {
            display: flex;
            color: var(--silver);
            background: rgba(156, 163, 175, 0.15);
        }

        .hint {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .hint span {
            color: var(--gold);
            font-weight: 600;
        }

        /* 버튼 */
        .button-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .submit-btn {
            background: var(--text-primary);
            color: var(--bg-primary);
            border: none;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .view-result-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 14px;
            font-size: 0.9375rem;
            font-weight: 500;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .view-result-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        /* 결과 페이지 */
        .results-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 24px;
        }

        .result-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 14px 16px;
            background: var(--bg-card);
            border-radius: 12px;
        }

        .result-item.rank-1 {
            background: linear-gradient(135deg, rgba(251,191,36,0.15) 0%, rgba(251,191,36,0.05) 100%);
            border: 1px solid rgba(251,191,36,0.3);
            padding: 18px 16px;
        }

        .result-rank {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8125rem;
            font-weight: 700;
            border-radius: 6px;
            margin-right: 14px;
            background: var(--bg-hover);
            color: var(--text-secondary);
        }

        .result-item.rank-1 .result-rank { background: var(--gold); color: #000; width: 32px; height: 32px; }
        .result-item.rank-2 .result-rank { background: var(--silver); color: #000; }
        .result-item.rank-3 .result-rank { background: var(--bronze); color: #fff; }

        .result-label { flex: 1; font-size: 0.9375rem; font-weight: 500; }
        .result-item.rank-1 .result-label { font-weight: 700; font-size: 1.0625rem; }

        .result-score { font-size: 1.125rem; font-weight: 700; }
        .result-item.rank-1 .result-score { color: var(--gold); font-size: 1.375rem; }
        .result-score span { font-size: 0.75rem; font-weight: 400; color: var(--text-muted); margin-left: 2px; }

        .total-votes {
            text-align: center;
            margin-top: 32px;
            padding-top: 28px;
            border-top: 1px solid var(--border);
        }

        .total-label { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 4px; }
        .total-number { font-size: 3rem; font-weight: 700; letter-spacing: -0.02em; }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 32px;
        }

        .back-btn {
            background: var(--text-primary);
            color: var(--bg-primary);
            border: none;
            padding: 14px;
            font-size: 0.9375rem;
            font-weight: 600;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .back-btn:hover { background: var(--accent-hover); }

        .reset-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 14px;
            font-size: 0.9375rem;
            font-weight: 500;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .reset-btn:hover { border-color: var(--danger); color: var(--danger); }

        /* 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 32px;
            border-radius: 16px;
            text-align: center;
            max-width: 340px;
            margin: 20px;
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal h3 { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
        .modal p { color: var(--text-secondary); font-size: 0.9375rem; margin-bottom: 24px; line-height: 1.6; }

        .modal-buttons { display: flex; gap: 12px; justify-content: center; }

        .modal-btn {
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn.cancel { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); }
        .modal-btn.cancel:hover { background: var(--bg-hover); color: var(--text-primary); }
        .modal-btn.confirm { background: var(--danger); border: none; color: white; }
        .modal-btn.confirm:hover { background: var(--danger-hover); }

        .success-modal .modal { padding: 40px 32px; }

        .success-icon {
            width: 64px; height: 64px;
            background: var(--success);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }

        .success-icon svg { width: 32px; height: 32px; color: white; }
        .success-modal h3 { margin-bottom: 24px; }

        .success-modal .modal-btn.ok {
            background: var(--text-primary);
            border: none;
            color: var(--bg-primary);
            padding: 14px 48px;
        }

        .success-modal .modal-btn.ok:hover { background: var(--accent-hover); }
    </style>
</head>
<body>
    <div class="container">
        <!-- 투표 페이지 -->
        <div class="page active" id="votePage">
            <h1 class="title">🍽️ 회식 장소 투표</h1>
            <p class="subtitle">가고 싶은 곳 2개를 선택해주세요.</p>

            <div class="place-list" id="placeList">
                <div class="place-card" data-place="라몬">
                    <span class="place-name">라몬</span>
                </div>
                <div class="place-card" data-place="평냉">
                    <span class="place-name">평냉</span>
                </div>
                <div class="place-card" data-place="딤섬귀진">
                    <span class="place-name">딤섬귀진</span>
                </div>
                <div class="place-card" data-place="직화장인">
                    <span class="place-name">직화장인</span>
                </div>
            </div>

            <p class="hint" id="hint"><span>0</span> / 2 선택</p>

            <div class="button-section">
                <button class="submit-btn" id="submitBtn" disabled>투표하기</button>
                <button class="view-result-btn" id="viewResultBtn">투표 결과 보기</button>
            </div>
        </div>

        <!-- 결과 페이지 -->
        <div class="page" id="resultPage">
            <h1 class="title">투표 현황</h1>
            <p class="subtitle">점수 순으로 정렬된 결과입니다</p>

            <div class="results-container">
                <div id="resultsMain"></div>
                <div class="total-votes">
                    <p class="total-label">총 참여자 수</p>
                    <p class="total-number" id="totalVotes">0</p>
                </div>
                <div class="button-group">
                    <button class="back-btn" id="backBtn">투표하러 가기</button>
                    <button class="reset-btn" id="resetBtn">결과 초기화</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 투표 완료 모달 -->
    <div class="modal-overlay success-modal" id="successModal">
        <div class="modal">
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h3>투표가 완료되었습니다</h3>
            <div class="modal-buttons">
                <button class="modal-btn ok" id="closeSuccessModal">확인</button>
            </div>
        </div>
    </div>

    <!-- 리셋 확인 모달 -->
    <div class="modal-overlay" id="resetModal">
        <div class="modal">
            <h3>결과를 초기화할까요?</h3>
            <p>모든 투표 데이터가 삭제됩니다.<br>이 작업은 되돌릴 수 없습니다.</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="cancelReset">취소</button>
                <button class="modal-btn confirm" id="confirmReset">초기화</button>
            </div>
        </div>
    </div>

    <script type="module">
        await new Promise(resolve => setTimeout(resolve, 500));

        const db = window.firebaseDB;
        const doc = window.firebaseDoc;
        const setDoc = window.firebaseSetDoc;
        const onSnapshot = window.firebaseOnSnapshot;

        const PLACES = ['라몬', '평냉', '딤섬귀진', '직화장인'];
        const POINTS = [1, 1];

        let scores = { '라몬': 0, '평냉': 0, '딤섬귀진': 0, '직화장인': 0 };
        let totalVoteCount = 0;
        let selected = []; // [1순위, 2순위]

        const voteDocRef = doc(db, 'votes', 'dinnerVote');

        onSnapshot(voteDocRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                scores = data.scores || scores;
                totalVoteCount = data.totalVoteCount || 0;
                renderResults();
            }
        });

        async function saveToFirestore() {
            await setDoc(voteDocRef, {
                scores,
                totalVoteCount,
                lastUpdated: new Date().toISOString()
            });
        }

        const cards = document.querySelectorAll('.place-card');
        const submitBtn = document.getElementById('submitBtn');
        const hint = document.getElementById('hint');

        function updateCards() {
            cards.forEach(card => {
                const place = card.dataset.place;
                const idx = selected.indexOf(place);
                card.classList.remove('selected-1', 'selected-2');

                if (idx === 0) card.classList.add('selected-1');
                else if (idx === 1) card.classList.add('selected-2');
            });

            hint.innerHTML = `<span>${selected.length}</span> / 2 선택`;
            submitBtn.disabled = selected.length < 2;
        }

        cards.forEach(card => {
            card.addEventListener('click', () => {
                const place = card.dataset.place;
                const idx = selected.indexOf(place);

                if (idx !== -1) {
                    selected.splice(idx, 1);
                } else if (selected.length < 2) {
                    selected.push(place);
                }

                updateCards();
            });
        });

        function showPage(page) {
            document.getElementById('votePage').classList.remove('active');
            document.getElementById('resultPage').classList.remove('active');
            page.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderResults() {
            const resultsMain = document.getElementById('resultsMain');
            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);

            resultsMain.innerHTML = sorted.map(([name, value], index) => {
                const rankClass = index < 3 ? `rank-${index + 1}` : '';
                return `
                    <div class="result-item ${rankClass}">
                        <div class="result-rank">${index + 1}</div>
                        <span class="result-label">${name}</span>
                        <span class="result-score">${value}<span>점</span></span>
                    </div>
                `;
            }).join('');

            document.getElementById('totalVotes').textContent = totalVoteCount;
        }

        submitBtn.addEventListener('click', async () => {
            if (selected.length < 2) return;

            submitBtn.disabled = true;
            submitBtn.textContent = '저장 중...';

            selected.forEach((place, index) => {
                scores[place] += POINTS[index];
            });

            totalVoteCount++;

            try {
                await saveToFirestore();
            } catch (e) {
                console.error(e);
            }

            renderResults();
            selected = [];
            updateCards();
            submitBtn.textContent = '투표하기';

            showPage(document.getElementById('resultPage'));
        });

        document.getElementById('closeSuccessModal').addEventListener('click', () => {
            document.getElementById('successModal').classList.remove('show');
        });

        document.getElementById('successModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('successModal'))
                document.getElementById('successModal').classList.remove('show');
        });

        document.getElementById('viewResultBtn').addEventListener('click', () => {
            renderResults();
            showPage(document.getElementById('resultPage'));
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            showPage(document.getElementById('votePage'));
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('resetModal').classList.add('show');
        });

        document.getElementById('cancelReset').addEventListener('click', () => {
            document.getElementById('resetModal').classList.remove('show');
        });

        document.getElementById('confirmReset').addEventListener('click', async () => {
            scores = { '라몬': 0, '평냉': 0, '딤섬귀진': 0, '직화장인': 0 };
            totalVoteCount = 0;
            await saveToFirestore();
            renderResults();
            document.getElementById('resetModal').classList.remove('show');
        });

        document.getElementById('resetModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('resetModal'))
                document.getElementById('resetModal').classList.remove('show');
        });

        renderResults();
    </script>
</body>
</html>
